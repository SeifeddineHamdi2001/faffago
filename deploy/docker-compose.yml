# Faffa Go in production (D-100). Always run through deploy/*.sh, or by hand as:
#
#   cd /opt/faffago
#   docker compose -f deploy/docker-compose.yml --env-file /etc/faffago/faffago.env <command>
#
# The --env-file fills the ${…} below; the api container also reads the whole
# file. Ports listen on 127.0.0.1 only: the server's Nginx is the way in, for
# the web app (4000) and the API (4001). The database has no port on the host.
#
# (The docker-compose.yml at the repository root is for development only.)

name: faffago

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    build: ./postgres
    image: faffago-postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: faffago_owner
      POSTGRES_PASSWORD: ${FAFFAGO_OWNER_DB_PASSWORD:?set in the env file}
      POSTGRES_DB: faffago
      POSTGRES_INITDB_ARGS: '--locale=fr_FR.UTF-8 --encoding=UTF8'
      FAFFAGO_APP_DB_PASSWORD: ${FAFFAGO_APP_DB_PASSWORD:?set in the env file}
    volumes:
      - faffago-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faffago_owner -d faffago']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set in the env file}
    image: faffago-app:latest
    restart: unless-stopped
    working_dir: /app/apps/api
    command: ['node', 'dist/main.js']
    env_file: /etc/faffago/faffago.env
    environment:
      # Nginx and the web app reach the API from private container addresses.
      TRUST_PROXY: 'loopback, uniquelocal'
      STORAGE_LOCAL_PATH: /data/documents
    volumes:
      # Encrypted CIN / patente files (D-32), on the host for the backups.
      - /var/lib/faffago/documents:/data/documents
    ports:
      - '127.0.0.1:${API_PORT:-4001}:${API_PORT:-4001}'
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    image: faffago-app:latest
    pull_policy: never
    restart: unless-stopped
    working_dir: /app/apps/web
    command:
      ['node', '/app/node_modules/next/dist/bin/next', 'start', '-H', '0.0.0.0', '-p', '4000']
    # Only what the web server needs: it holds no secret (D-15).
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:${API_PORT:-4001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - '127.0.0.1:${WEB_PORT:-4000}:4000'
    depends_on:
      - api
    logging: *logging

volumes:
  faffago-pgdata:
