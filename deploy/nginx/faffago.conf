# Faffa Go sites, next to the server's other projects (D-100). Installed once
# by deploy/setup-server.sh as /etc/nginx/sites-available/faffago; then
#
#   sudo certbot --nginx --redirect -d mirely.store -d www.mirely.store -d api.mirely.store
#
# adds the HTTPS listeners and certificates to this file, and renews them.
#
#   www.mirely.store   the web app: public site, seller space, back office.
#                      Its address is printed in every label's QR code (D-43).
#   api.mirely.store   the API, for the courier app. The web app reaches the API
#                      on 127.0.0.1 and never goes through here.
#   mirely.store       redirects to www.
#
# The API trusts X-Forwarded-For from loopback only (app.setup.ts).

server {
    listen 80;
    listen [::]:80;
    server_name www.mirely.store;

    access_log /var/log/nginx/faffago.access.log;
    error_log /var/log/nginx/faffago.error.log;
    # Seller documents (10 MB, D-32) go through the web app to the API.
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The courier app's APK and its checksum (tech-stack 5), put there by hand:
    #   /var/www/faffago-apk/faffago-coursier.apk
    #   /var/www/faffago-apk/faffago-coursier.apk.sha256
    location /apk/ {
        alias /var/www/faffago-apk/;
        default_type application/octet-stream;
        types { application/vnd.android.package-archive apk; }
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mirely.store;

    access_log /var/log/nginx/faffago-api.access.log;
    error_log /var/log/nginx/faffago-api.error.log;
    # A CSV import is JSON up to 5 MB (D-37).
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mirely.store;

    # A location, not a server-level return, so certbot's challenge still answers.
    location / {
        return 301 https://www.mirely.store$request_uri;
    }
}
